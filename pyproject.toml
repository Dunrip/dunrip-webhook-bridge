[project]
name = "dunrip-webhook-bridge"
version = "1.0.0"
description = "FastAPI webhook bridge that forwards GitHub and generic webhook events to Telegram-first destinations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-telegram-bot>=20.8,<23",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "anyio>=4.0,<5",
  "prometheus-client>=0.19,<1",
  "jinja2>=3.1,<4",
  "redis>=5.0,<8",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "websockets>=12.0,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "pytest-asyncio>=0.23,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app", "destinations"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

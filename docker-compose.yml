version: '3.8'

services:
  webhook-bridge:
    build: .
    container_name: webhook-bridge
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GENERIC_WEBHOOK_TOKEN=${GENERIC_WEBHOOK_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_BODY_SIZE=${MAX_BODY_SIZE:-1048576}
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-3600}
      - TELEGRAM_RETRIES=${TELEGRAM_RETRIES:-2}
      - CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-5}
      - CIRCUIT_BREAKER_TIMEOUT=${CIRCUIT_BREAKER_TIMEOUT:-60}
    restart: unless-stopped
    # Optional: resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    # Optional: connect to monitoring network
    networks:
      - webhook-net

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: webhook-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - webhook-net
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: webhook-grafana
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - webhook-net
    profiles:
      - monitoring

networks:
  webhook-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

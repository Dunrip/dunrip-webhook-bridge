name: Security - Dependency Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run pip-audit (fail on vulnerabilities)
        id: pip_audit
        run: uvx pip-audit -r requirements.txt

      - name: Security scan summary
        if: always()
        run: |
          echo "## Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ steps.pip_audit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Policy: build fails on vulnerabilities" >> $GITHUB_STEP_SUMMARY

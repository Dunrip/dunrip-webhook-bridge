name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: test-bot-token
          TELEGRAM_CHAT_ID: test-chat-id
          GITHUB_WEBHOOK_SECRET: test-github-secret
          GENERIC_WEBHOOK_TOKEN: test-generic-token
          ADMIN_API_KEY: test-admin-key
        run: uv run pytest tests/

  security-gates:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependency scan gate
        id: deps_scan
        run: uvx pip-audit -r requirements.txt

      - name: Secrets scan gate
        id: secrets_scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Security gate summary
        if: always()
        run: |
          echo "## Release security gates" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency scan: ${{ steps.deps_scan.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan: ${{ steps.secrets_scan.outcome }}" >> $GITHUB_STEP_SUMMARY

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit gitleaks

      - name: Dependency scan gate
        id: deps_scan
        run: pip-audit -r requirements.txt

      - name: Secrets scan gate
        id: secrets_scan
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Security gate summary
        if: always()
        run: |
          echo "## Release security gates" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency scan: ${{ steps.deps_scan.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan: ${{ steps.secrets_scan.outcome }}" >> $GITHUB_STEP_SUMMARY

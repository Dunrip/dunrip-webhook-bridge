name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit gitleaks

      - name: Dependency scan gate
        id: deps_scan
        run: pip-audit -r requirements.txt

      - name: Secrets scan gate
        id: secrets_scan
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Security gate summary
        if: always()
        run: |
          echo "## Release security gates" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency scan: ${{ steps.deps_scan.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan: ${{ steps.secrets_scan.outcome }}" >> $GITHUB_STEP_SUMMARY

  docker:
    needs: security-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: Publish GHCR Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dunrip/dunrip-webhook-bridge
          labels: |
            org.opencontainers.image.title=dunrip-webhook-bridge
            org.opencontainers.image.description=Webhook bridge for GitHub and generic events to Telegram-first destinations
            org.opencontainers.image.vendor=Dunrip
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Determine Trivy gate mode
        id: trivy_mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "mode=blocking-release" >> "$GITHUB_OUTPUT"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "mode=non-blocking-main" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/dunrip/dunrip-webhook-bridge:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: ${{ steps.trivy_mode.outputs.exit_code }}
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore

      - name: Trivy gate summary
        if: always()
        run: |
          echo "## GHCR Trivy Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: `${{ steps.trivy_mode.outputs.mode }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code policy: `${{ steps.trivy_mode.outputs.exit_code }}` (1=blocking, 0=non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: CRITICAL,HIGH (ignore unfixed=true)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline/Suppressions: `.trivyignore` (tracked with owner + expiry)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy doc: `docs/ops/trivy-ghcr-policy.md`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
